<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>AIAng cancel request fixture</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px; background: #eef0f2; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(760px, 100%); margin: auto; padding: 28px; border-radius: 20px; background: white; }
    textarea { display: block; width: 100%; height: 180px; padding: 18px; border: 1px solid #ccd4df; border-radius: 12px; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>요청 취소 테스트</h1>
    <textarea placeholder="댓글을 입력하세요">취소 동작을 확인할 문장입니다.</textarea>
  </main>
  <script>
    window.aiangCancelTest = { started: [], cancelled: [] };
    const pending = new Map();
    window.chrome = {
      runtime: {
        lastError: null,
        getURL: value => value,
        sendMessage(message, callback) {
          if (message.type === 'GET_SETTINGS') {
            callback({ ok: true, settings: { enabled: true } });
            return;
          }
          if (message.type === 'PROCESS_TEXT') {
            window.aiangCancelTest.started.push(message.requestId);
            document.body.dataset.startedRequest = message.requestId;
            pending.set(message.requestId, callback);
            return;
          }
          if (message.type === 'CANCEL_REQUEST') {
            window.aiangCancelTest.cancelled.push(message.requestId);
            document.body.dataset.cancelledRequest = message.requestId;
            callback({ ok: true });
            const processCallback = pending.get(message.requestId);
            pending.delete(message.requestId);
            setTimeout(() => processCallback?.({ ok: false, error: '요청을 취소했습니다.' }));
            return;
          }
          callback({ ok: true });
        }
      },
      storage: { onChanged: { addListener() {} } }
    };
  </script>
  <script src="../content.js"></script>
</body>
</html>
