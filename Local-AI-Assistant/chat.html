<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local AI Assistant (LLM) Chat</title>
    <link rel="stylesheet" href="chat.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <img src="icons/icon48.png" alt="Logo" class="logo">
            <h1 data-i18n="extName">Local AI Assistant (LLM)</h1>
        </div>
        <div class="header-right">
            <button id="copyBtn" class="header-btn" data-i18n-title="copyLastResponse"
                title="Copy Last Response">📋</button>
            <button id="clearBtn" class="header-btn" data-i18n-title="clearChat" title="Clear Chat">🗑️</button>
        </div>
    </header>

    <!-- Chat Content -->
    <main class="chat-content" id="chatContent">
        <!-- Chat bubbles will be added here -->
        <div id="dropZoneContainer" class="drop-zone-overlay" style="display: none;">
            <div class="drop-zone-content">
                <span class="drop-icon">➕</span>
                <p data-i18n="dropFilesHint">Drop images or text here</p>
            </div>
        </div>
    </main>

    <!-- Quick Actions (Fixed above footer) -->
    <div id="quickActionsContainer" class="quick-actions" style="display: none;">
        <button id="summarizePageBtn" class="quick-action-btn" data-i18n="summarizePageBtnTitle"
            title="Summarize Webpage">웹페이지 요약</button>
        <button id="askWebpageBtn" class="quick-action-btn" data-i18n="askWebpageBtnTitle" title="Ask Webpage">웹페이지
            물어보기</button>
        <button id="capturePageBtn" class="quick-action-btn" data-i18n="capturePageBtnTitle" title="Capture Webpage">화면
            캡쳐 질문</button>
    </div>

    <!-- Footer Input -->
    <footer class="footer">
        <div id="imagePreviewContainer" class="image-preview-container" style="display: none;">
            <img id="imagePreview" alt="Pasted Image Preview">
            <button id="removeImageBtn" class="remove-image-btn" title="Remove Image">✕</button>
        </div>
        <div class="input-container">
            <textarea id="messageInput" data-i18n-placeholder="sendAdditionalMessage"
                placeholder="Send additional message..." rows="1"></textarea>
            <button id="sendBtn" class="send-btn" data-i18n-title="send" title="Send">➤</button>
        </div>
    </footer>

    <script src="custom_i18n.js"></script>
    <script src="chat.js"></script>
</body>

</html>
