<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #0d0f18;
      color: #e2e8f0;
      width: 280px;
      margin: 0;
      padding: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
      justify-content: center;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #0d0f18;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(79, 172, 254, 0.2);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 172, 254, 0.3);
    }
    .instructions {
      font-size: 11px;
      color: #a0aec0;
      line-height: 1.5;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 6px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .instruction-step {
      margin-bottom: 6px;
    }
    .instruction-step:last-child {
      margin-bottom: 0;
    }
    .step-number {
      color: #00f2fe;
      font-weight: 600;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:#00f2fe;">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    3D EXTRACTOR
  </div>
  
  <button class="btn" id="toggle-ui-btn">Toggle Overlay Panel</button>
  
  <div class="instructions">
    <div class="instruction-step">
      <span class="step-number">1.</span> Open a 3D WebGL page (e.g. VWorld Map).
    </div>
    <div class="instruction-step">
      <span class="step-number">2.</span> Click <b>Toggle Overlay Panel</b> or click the floating 3D badge in the bottom-right.
    </div>
    <div class="instruction-step">
      <span class="step-number">3.</span> Click <b>Start Capture</b>, drag/rotate the map, and click <b>Stop Capture</b> to export meshes & textures!
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
